<div class="container">
  <section class="services-section">

    <!-- Lado Izquierdo: Información -->
    <div class="service-content">
      <span class="agency-tag-accent">Let's Build Together</span>
      <h2 class="contact-main-heading">Llevemos tu marca al siguiente nivel</h2>
      <p class="contact-pitch">
        ¿Listo para transformar tu captación de clientes? Completa el formulario o escríbenos directamente. Diseñemos
        una estrategia a la medida de tu negocio.
      </p>
      <div class="minimal-channels">
        <p>ecaiainfo&#64;gmail.com</p>
      </div>
    </div>

    <!-- Lado Derecho: Formulario Reactivo -->
    <div class="service-illustration">
      <form [formGroup]="contactForm" (ngSubmit)="onSubmit($event)" *ngIf="!submitSuccess()" class="glass-form">

        <div class="form-field-wrapper">
          <input type="text" id="nombre" formControlName="nombre" placeholder=" ">
          <label for="nombre">Nombre completo</label>
        </div>

        <div class="form-field-wrapper">
          <input type="email" id="email" formControlName="email" placeholder=" ">
          <label for="email">Correo electrónico</label>
        </div>

        <!-- Campo Empresa añadido para mantener coherencia con el FormGroup -->
        <div class="form-field-wrapper">
          <input type="text" id="empresa" formControlName="empresa" placeholder=" ">
          <label for="empresa">Empresa</label>
        </div>

        <div class="form-field-wrapper">
          <select id="servicio" formControlName="servicio">
            <option value="" disabled selected></option>
            <option value="marketing">Marketing Estratégico</option>
            <option value="tech">Tecnología & Automatización</option>
          </select>
          <label for="servicio" class="floating-label">¿Qué solución necesitas?</label>
        </div>

        <div class="form-field-wrapper">
          <textarea id="mensaje" formControlName="mensaje" placeholder=" " rows="4"></textarea>
          <label for="mensaje">Cuéntanos sobre tu proyecto</label>
        </div>

        <button type="submit" class="btn-earth-submit" [disabled]="isSubmitting() || contactForm.invalid">
          {{ isSubmitting() ? 'Enviando...' : 'Iniciar Conversación' }}
        </button>
      </form>
    </div>

  </section>
</div>
